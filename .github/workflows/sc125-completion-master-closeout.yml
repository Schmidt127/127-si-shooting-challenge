name: SC125 Completion Master Closeout
on:
  push:
    branches: [docs/sc-125-completion-master-closeout]
    paths:
      - .github/workflows/sc125-completion-master-closeout.yml
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/sc-125-completion-master-closeout
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply closeout
        run: python tools/testing/sc125_completion_master_closeout.py
      - name: Validate Completion Master
        run: node tools/testing/check-completion-master-integrity.js
      - name: Commit result and remove helpers
        run: |
          rm .github/workflows/sc125-completion-master-closeout.yml tools/testing/sc125_completion_master_closeout.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/SHOOTING_CHALLENGE_COMPLETION_MASTER.md .github/workflows/sc125-completion-master-closeout.yml tools/testing/sc125_completion_master_closeout.py
          git commit -m "docs(sc-125): record production Homework closeout"
          git push origin HEAD:docs/sc-125-completion-master-closeout
