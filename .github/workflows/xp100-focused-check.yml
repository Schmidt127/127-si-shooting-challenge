name: XP100 focused reliability check

on:
  push:
    branches:
      - reliability-wave/xp-orphan-reconciliation
    paths:
      - .github/workflows/xp100-focused-check.yml

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Reliability Command Center workflow tests
        run: node tests/reliability-command-center/workflows.test.js
