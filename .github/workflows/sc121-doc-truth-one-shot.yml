name: SC-121 doc truth one-shot
on:
  push:
    branches:
      - reliability-wave/sc-121-terminal-week-boundary
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reliability-wave/sc-121-terminal-week-boundary
      - name: Align 057 canonical/live truth
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              Path('docs/automation-index.md'): [
                  (
                      '`057-achievements-and-milestones-calculate-perfect-week-eligibility.js` (**Live v2.5** — SC-160 early HW counts for assigned-week Perfect Week; late still excluded; SC-152 clears `Perfect Week Recalc Needed?` on writeback; Config-driven Perfect Week video minimum (SC-034); inactive enrollment and unsettled/multiple/wrong-scope goals fail closed; requires lookup parity with the linked active goal)',
                      '`057-achievements-and-milestones-calculate-perfect-week-eligibility.js` (**GitHub v2.6; Live v2.5 pending SC-121 paste** — v2.6 supports partial terminal Week dates while preserving the normal 1/7 daily pace; SC-160 early HW counts for assigned-week Perfect Week; late still excluded; SC-152 clears `Perfect Week Recalc Needed?` on writeback; Config-driven Perfect Week video minimum (SC-034); inactive enrollment and unsettled/multiple/wrong-scope goals fail closed; requires lookup parity with the linked active goal)'
                  )
              ],
              Path('airtable/schema/current/automation-trigger-map.md'): [
                  (
                      '`057-...-calculate-perfect-week-eligibility.js` (**v2.5** — SC-160 early HW + SC-152 Live Tested)',
                      '`057-...-calculate-perfect-week-eligibility.js` (**GitHub v2.6; Live v2.5 pending SC-121 paste** — partial terminal Week support; prior SC-160/SC-152 live proof remains historical for v2.5)'
                  )
              ],
              Path('docs/CURRENT-TRUTH.md'): [
                  (
                      '| **057** | **2.5** | **2.5 Live** | Queue?=1; formula Pending OR Recalc | SC-160 early HW counts for assigned-week Perfect Week; late excluded. Evidence [`audits/SC-160-STAGE6-LIVE-VERIFICATION-20260904.md`](./audits/SC-160-STAGE6-LIVE-VERIFICATION-20260904.md) |',
                      '| **057** | **v2.6** | **v2.5** | GitHub ahead / **paste pending** | SC-121 partial terminal Week repair; Live remains v2.5 until native Airtable paste + controlled proof. Prior SC-160 evidence remains valid for the v2.5 baseline: [`audits/SC-160-STAGE6-LIVE-VERIFICATION-20260904.md`](./audits/SC-160-STAGE6-LIVE-VERIFICATION-20260904.md) |'
                  )
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'expected text not found in {path}: {old}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
      - name: Commit and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/automation-index.md airtable/schema/current/automation-trigger-map.md docs/CURRENT-TRUTH.md
          git commit -m "docs(sc-121): align 057 canonical and live truth"
          git rm .github/workflows/sc121-doc-truth-one-shot.yml
          git commit -m "chore(sc-121): remove one-shot truth helper"
          git push origin HEAD:reliability-wave/sc-121-terminal-week-boundary
