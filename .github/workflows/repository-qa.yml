name: Repository QA

on:
  push:
    branches: [master, main]
    paths:
      - "airtable/**"
      - "lambda/**"
      - "lib/**"
      - "tests/**"
      - "tools/**"
      - "docs/SHOOTING_CHALLENGE_COMPLETION_MASTER.md"
      - ".github/workflows/repository-qa.yml"
  pull_request:
    paths:
      - "airtable/**"
      - "lambda/**"
      - "lib/**"
      - "tests/**"
      - "tools/**"
      - "docs/SHOOTING_CHALLENGE_COMPLETION_MASTER.md"
      - ".github/workflows/repository-qa.yml"

permissions:
  contents: read

jobs:
  automation-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run repository automation and season contracts
        run: node tools/testing/run-agent4-suite.js
      - name: Audit active source-of-truth references
        run: node tools/testing/audit-source-of-truth.mjs

  python-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            tools/airtable/requirements.txt
            lambda/upload-asset/requirements.txt
      - name: Install test dependencies
        run: pip install -r tools/airtable/requirements.txt -r lambda/upload-asset/requirements.txt
      - name: Run Airtable tooling contracts
        run: python -m unittest discover -s tools/airtable/tests -p 'test_*.py'
      - name: Run upload Lambda contracts
        run: python -m unittest discover -s lambda/upload-asset/tests -p 'test_*.py'
