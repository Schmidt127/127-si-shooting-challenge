name: SC Structured HC XP Patch

on:
  push:
    branches:
      - sc-structured-hc-xp-065-v10-8

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sc-structured-hc-xp-065-v10-8
          fetch-depth: 0

      - name: Apply repair
        run: python tools/_tmp_patch_structured_hc_xp_v2.py

      - name: Run focused contract
        run: node tests/automation-contracts/065-structured-hc-only-contract.test.js

      - name: Remove temporary helpers
        run: |
          rm -f tools/_tmp_patch_structured_hc_xp.py
          rm -f tools/_tmp_patch_structured_hc_xp_v2.py
          rm -f .github/workflows/sc-structured-hc-xp-patch.yml

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(homework): support HC-only Structured Curriculum XP"
          git push origin HEAD:sc-structured-hc-xp-065-v10-8
