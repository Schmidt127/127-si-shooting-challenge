name: SC122 Overlay Runner
on:
  push:
    branches: [docs/sc-122-completion-master-reconciliation]
    paths:
      - .github/workflows/sc122-overlay-runner.yml
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/sc-122-completion-master-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply overlay
        run: python tools/testing/sc122_completion_master_overlay.py
      - name: Validate Completion Master
        run: node tools/testing/check-completion-master-integrity.js
      - name: Commit result and remove helpers
        run: |
          rm .github/workflows/sc122-overlay-runner.yml tools/testing/sc122_completion_master_overlay.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/SHOOTING_CHALLENGE_COMPLETION_MASTER.md .github/workflows/sc122-overlay-runner.yml tools/testing/sc122_completion_master_overlay.py
          git commit -m "docs(sc-122): reconcile current Completion Master truth"
          git push origin HEAD:docs/sc-122-completion-master-reconciliation
